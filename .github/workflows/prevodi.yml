name: Preverbe

# Prve samodejne preverbe za ta repozitorij. Tecejo brez Android SDK, zato so
# gotove v nekaj sekundah in nic ne stanejo.
#
#  1. prevodi  -- jezik, ki zaostaja za privzetim, bi uporabniku pokazal prazno
#                 polje ali slovenscino. To smo doslej iskali rocno.
#  2. zaznavalnika -- sivi plakat pred videom in dvojna oznaka fokusa sta bila
#                 popravljena; ta preverba pazi, da zaznavalnika, s katerima ju
#                 merimo na televizorju, se vedno prepoznata pravi posnetek
#                 zaslona pred popravkom. Ce kdo zaznavalnik omehca, pade.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preverbe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Vsak jezik mora imeti vse kljuce
        run: python3 tools/preveri-prevode.py .

      - name: Pillow za branje posnetkov zaslona
        run: python3 -m pip install --quiet Pillow

      - name: Zaznavalnika morata prepoznati oba hrosca
        run: python3 -m unittest discover -s tests -p 'test_zaznaj.py' -v

      - name: Kotlin 1.9.24 (ista razlicica kot doma, pripeta kontrolna vsota)
        run: |
          curl -fsSL -o /tmp/kotlinc.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          echo "eb7b68e01029fa67bc8d060ee54c12018f2c60ddc438cf21db14517229aa693b  /tmp/kotlinc.zip" | sha256sum -c -
          unzip -q /tmp/kotlinc.zip -d /tmp

      - name: Pravila blokiranja in skrivanja (motor brez Androida)
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: bash tools/preveri-motor.sh
